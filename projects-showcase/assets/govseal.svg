    <rect x="620" y="710" width="86" height="22" rx="11" fill="#173226"/><text x="636" y="725" fill="#5fb98e" font-size="12">healthy</text>
    <text x="860" y="724">0.97</text>
    <rect x="1120" y="712" width="60" height="16" rx="8" fill="#173226"/><text x="1150" y="724" fill="#5fb98e" font-size="11" text-anchor="middle">low</text>
    <text x="1310" y="724" fill="#8b96a0">2m ago</text>

    <text x="240" y="766">onboarding-agent-prod</text>
    <rect x="620" y="752" width="86" height="22" rx="11" fill="#173226"/><text x="636" y="767" fill="#5fb98e" font-size="12">healthy</text>
    <text x="860" y="766">0.95</text>
    <rect x="1120" y="754" width="60" height="16" rx="8" fill="#173226"/><text x="1150" y="766" fill="#5fb98e" font-size="11" text-anchor="middle">low</text>
    <text x="1310" y="766" fill="#8b96a0">11m ago</text>

