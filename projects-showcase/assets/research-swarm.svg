<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d10"/><stop offset="1" stop-color="#0f141a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg4)"/>

  <rect x="0" y="0" width="1600" height="72" fill="#10151b"/>
  <circle cx="42" cy="36" r="11" fill="none" stroke="#5b6ee1" stroke-width="2.4"/>
  <circle cx="42" cy="36" r="3.5" fill="#5b6ee1"/>
  <text x="66" y="42" fill="#f4efe6" font-size="22" font-weight="600">Research Swarm</text>
  <text x="252" y="42" fill="#7f8b95" font-size="15">Multi-Agent Enterprise Research System</text>
  <rect x="1310" y="20" width="270" height="32" rx="16" fill="#161c23"/>
  <circle cx="1332" cy="36" r="5" fill="#5fb98e"/>
  <text x="1346" y="41" fill="#9aa4ad" font-size="13">Run complete · 4 agents · 12 tool calls</text>

  <!-- agent graph panel -->
  <rect x="30" y="100" width="760" height="470" rx="14" fill="#12181f"/>
  <text x="54" y="140" fill="#f4efe6" font-size="17" font-weight="600">Agent orchestration graph</text>
  <text x="54" y="162" fill="#7f8b95" font-size="12">planner → researcher × 2 → verifier → writer</text>

  <!-- nodes -->
  <circle cx="150" cy="260" r="34" fill="#1c2733" stroke="#5b6ee1" stroke-width="2"/>
  <text x="150" y="265" fill="#f4efe6" font-size="12" text-anchor="middle">Planner</text>

  <circle cx="380" cy="200" r="34" fill="#1c2733" stroke="#199e70" stroke-width="2"/>
  <text x="380" y="197" fill="#f4efe6" font-size="11" text-anchor="middle">Researcher</text>
  <text x="380" y="211" fill="#f4efe6" font-size="11" text-anchor="middle">(web)</text>

  <circle cx="380" cy="330" r="34" fill="#1c2733" stroke="#199e70" stroke-width="2"/>
  <text x="380" y="327" fill="#f4efe6" font-size="11" text-anchor="middle">Researcher</text>
  <text x="380" y="341" fill="#f4efe6" font-size="11" text-anchor="middle">(internal docs)</text>

  <circle cx="600" cy="260" r="34" fill="#1c2733" stroke="#c98500" stroke-width="2"/>
  <text x="600" y="265" fill="#f4efe6" font-size="12" text-anchor="middle">Verifier</text>

  <circle cx="710" cy="440" r="34" fill="#1c2733" stroke="#d9843f" stroke-width="2"/>
  <text x="710" y="445" fill="#f4efe6" font-size="12" text-anchor="middle">Writer</text>

  <g stroke="#3a434c" stroke-width="1.6" fill="none">
    <line x1="182" y1="252" x2="348" y2="208"/>
    <line x1="182" y1="270" x2="348" y2="322"/>
    <line x1="412" y1="204" x2="568" y2="256"/>
    <line x1="412" y1="326" x2="568" y2="266"/>
    <line x1="628" y1="278" x2="692" y2="416"/>
  </g>

  <text x="54" y="510" fill="#7f8b95" font-size="12">Live trace</text>
  <g font-size="12" fill="#c9d2da">
    <circle cx="62" cy="536" r="4" fill="#5b6ee1"/><text x="76" y="541">Planner decomposed query into 3 sub-questions</text>
    <circle cx="62" cy="562" r="4" fill="#199e70"/><text x="76" y="567">Researcher(web) called search_web × 4</text>
    <circle cx="62" cy="588" r="4" fill="#199e70"/><text x="76" y="593">Researcher(docs) called retrieve_internal × 3</text>
    <circle cx="62" cy="614" r="4" fill="#c98500"/><text x="76" y="619">Verifier flagged 1 unsupported claim, requested re-check</text>
    <circle cx="62" cy="640" r="4" fill="#d9843f"/><text x="76" y="645">Writer synthesized cited brief · 812 words</text>
  </g>

  <!-- side panel -->
  <rect x="812" y="100" width="758" height="222" rx="14" fill="#12181f"/>
  <text x="836" y="140" fill="#f4efe6" font-size="17" font-weight="600">Run summary</text>
  <g font-size="13" fill="#c9d2da">
    <text x="836" y="176" fill="#7f8b95">Query</text>
    <text x="836" y="198">"What changed in enterprise RAG evaluation practice in 2026?"</text>
    <text x="836" y="228" fill="#7f8b95">Tool calls</text>
    <text x="836" y="250">12 (8 web, 3 internal, 1 verification pass)</text>
    <text x="836" y="280" fill="#7f8b95">Cost / latency</text>
    <text x="836" y="302">$0.34 · 48s wall-clock</text>
  </g>

  <rect x="812" y="338" width="758" height="232" rx="14" fill="#12181f"/>
  <text x="836" y="378" fill="#f4efe6" font-size="17" font-weight="600">Synthesized brief (excerpt)</text>
  <g font-size="13" fill="#a9b2ba">
    <text x="836" y="410">Three shifts stand out: evaluation moved from spot-checks to</text>
    <text x="836" y="432">continuous regression suites, LLM-as-judge pipelines added a</text>
    <text x="836" y="454">human-agreement calibration step, and teams now version</text>
    <text x="836" y="476">retrieval corpora alongside prompts for reproducibility [1][2].</text>
  </g>
  <rect x="836" y="500" width="700" height="1" fill="#1e262f"/>
  <text x="836" y="524" fill="#6b757e" font-size="11">[1] internal:eval-practices-2026.md  [2] web:arxiv.org/abs/2026.xxxxx</text>

  <!-- bottom: agent roster -->
  <rect x="30" y="590" width="1540" height="270" rx="14" fill="#12181f"/>
  <text x="54" y="630" fill="#f4efe6" font-size="17" font-weight="600">Agent roster &amp; tools</text>
  <g font-size="13" fill="#c9d2da">
    <text x="54" y="668" fill="#7f8b95">AGENT</text><text x="300" y="668" fill="#7f8b95">ROLE</text><text x="700" y="668" fill="#7f8b95">TOOLS</text><text x="1200" y="668" fill="#7f8b95">CALLS</text>
    <line x1="54" y1="682" x2="1546" y2="682" stroke="#1e262f"/>
    <text x="54" y="716">Planner</text><text x="300" y="716">Decompose &amp; route sub-questions</text><text x="700" y="716">task_graph</text><text x="1200" y="716">1</text>
    <text x="54" y="754">Researcher (web)</text><text x="300" y="754">External evidence gathering</text><text x="700" y="754">search_web, fetch_url</text><text x="1200" y="754">8</text>
    <text x="54" y="792">Researcher (internal)</text><text x="300" y="792">Internal knowledge retrieval</text><text x="700" y="792">retrieve_internal</text><text x="1200" y="792">3</text>
    <text x="54" y="830">Verifier</text><text x="300" y="830">Cross-check claims across sources</text><text x="700" y="830">compare_claims</text><text x="1200" y="830">1</text>
  </g>
</svg>
