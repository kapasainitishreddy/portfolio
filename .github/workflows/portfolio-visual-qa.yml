name: Portfolio Visual QA

on:
  pull_request:
    branches:
      - claude/sharp-tesla-f8epam

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production server
        shell: bash
        run: |
          npm start > /tmp/portfolio-server.log 2>&1 &
          echo $! > /tmp/portfolio-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-server.log
          exit 1

      - name: Capture desktop and mobile
        shell: bash
        run: |
          mkdir -p qa
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext();
            const page = await context.newPage();
            await page.addInitScript(() => sessionStorage.setItem('snrk_intro_seen', '1'));
            await page.setViewportSize({ width: 800, height: 560 });
            await page.goto('http://127.0.0.1:3000/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1200);
            await page.screenshot({ path: 'qa/portfolio-desktop.jpg', fullPage: false, type: 'jpeg', quality: 25 });
            await page.setViewportSize({ width: 390, height: 700 });
            await page.goto('http://127.0.0.1:3000/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1200);
            await page.screenshot({ path: 'qa/portfolio-mobile.jpg', fullPage: false, type: 'jpeg', quality: 25 });
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit QA screenshots to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/portfolio-desktop.jpg qa/portfolio-mobile.jpg
          if git diff --cached --quiet; then
            echo "No screenshot changes"
            exit 0
          fi
          git commit -m "ci: capture compact portfolio visual QA [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
