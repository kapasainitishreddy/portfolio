name: Refresh portfolio security dependencies

on:
  push:
    branches:
      - website/portfolio-release-hardening-final
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: website/portfolio-release-hardening-final

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pin safe PostCSS override for Next.js 15
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            next: {
              ...(pkg.overrides?.next || {}),
              postcss: '8.5.26',
            },
          };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Install patched Next.js Maintenance LTS
        run: npm install next@15.5.24 --save-exact

      - name: Apply available non-breaking npm audit fixes
        run: npm audit fix || true

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: High-severity dependency audit
        run: npm audit --audit-level=high

      - name: Next.js patched-floor gate
        run: npm run check:release-deps

      - name: Commit verified dependency refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: refresh patched portfolio dependencies"
          git pull --rebase origin website/portfolio-release-hardening-final
          git push origin HEAD:website/portfolio-release-hardening-final
