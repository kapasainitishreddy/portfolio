name: Portfolio CI

on:
  pull_request:
    branches:
      - claude/sharp-tesla-f8epam
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Redesign regression test
        run: node --test tests/portfolio-redesign.test.mjs

      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Report build failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'build.log';
            const log = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Build failed before build.log was produced.';
            const tail = log.split('\n').slice(-90).join('\n').slice(-12000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- portfolio-ci-build-failure -->\n### Portfolio CI build failure\n\n\`\`\`text\n${tail}\n\`\`\``,
            });
