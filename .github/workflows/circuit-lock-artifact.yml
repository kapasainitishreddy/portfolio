name: Generate Circuit lock artifact

on:
  push:
    branches:
      - tmp-do-not-use
    paths:
      - .github/workflows/circuit-lock-artifact.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/circuit-lock-repair
    steps:
      - name: Checkout disposable runner branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup pnpm 9.12.0
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tools/circuit-lock-repair/package.json

      - name: Generate lockfile from Circuit manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: circuit-pnpm-lock
          path: tools/circuit-lock-repair/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1

      - name: Verify premium fonts and hardened resolutions
        shell: bash
        run: |
          grep -q "@expo-google-fonts/jetbrains-mono" pnpm-lock.yaml
          grep -q "@expo-google-fonts/newsreader" pnpm-lock.yaml
          grep -q "mysql2: 3.22.0" pnpm-lock.yaml
          grep -q "mysql2@3.22.0" pnpm-lock.yaml
          grep -q "browserslist: 4.28.7" pnpm-lock.yaml
          grep -q "browserslist@4.28.7" pnpm-lock.yaml

      - name: Persist generated lockfile on disposable branch
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          cp tools/circuit-lock-repair/pnpm-lock.yaml circuit-generated-pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add circuit-generated-pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Generated lockfile is unchanged."
          else
            git commit -m "chore: persist generated Circuit lockfile"
            git push origin HEAD:tmp-do-not-use
          fi
