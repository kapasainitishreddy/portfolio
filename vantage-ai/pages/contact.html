</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Primary">
      <a class="brand" href="../index.html"><span class="brand-mark">V</span><span>VANTAGE&nbsp;AI</span></a>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="skills.html">Skills</a></li>
        <li><a href="timeline.html">Timeline</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <button class="theme-toggle" type="button" aria-label="Toggle color theme">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <span class="theme-label">Light mode</span>
      </button>
    </nav>
  </header>

  <main>
    <section>
      <div class="section-head">
        <span class="eyebrow">Page 06 · Contact</span>
        <h1>Start a <span class="accent">conversation</span>.</h1>
        <p class="lead">Brief is good. Project shape, timeline, and the problem you're trying to move the needle on. I'll reply within a couple of business days.</p>
      </div>

      <div class="contact-card reveal">
        <form id="contact-form" class="form" novalidate>
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </div>
          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="What are you working on?" required></textarea>
          </div>
          <button class="btn btn-primary" type="submit" style="justify-self:start">
            Send message →
          </button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© 2026 Vantage AI · Contact.</span>
      <span><a href="../index.html">← Home</a></span>
    </div>
  </footer>

  <script src="../assets/js/app.js"></script>
</body>
</html>
